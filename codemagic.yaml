# Codemagic CI: builds the iOS app on a cloud Mac, so no Mac is needed.
#
# FREE route (recommended, costs nothing):
#   workflow "ios-free-unsigned" builds BeamShare-unsigned.ipa with no Apple
#   account at all. Install it on your iPhone with SideStore/AltStore and your
#   normal (free) Apple ID. See README.md, "iPhone for free".
#   Codemagic's free plan includes 500 macOS build minutes per month;
#   one build takes about 10-15 minutes. Builds only start when you click
#   "Start new build" (no automatic triggers, so no minutes are wasted).
#
# PAID route (optional, 99 USD/year Apple Developer Program):
#   workflow "ios-testflight-paid" signs and uploads to TestFlight. Only use
#   it if you ever buy the Apple account; see the comments inside.

workflows:
  ios-free-unsigned:
    name: iOS (free, unsigned IPA)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Engine unit tests
        script: |
          cd packages/transfer_core
          dart pub get
          dart test test/blake3_test.dart test/unit_test.dart
      - name: Build unsigned app
        script: flutter build ios --release --no-codesign
      - name: Package as IPA
        script: |
          rm -rf Payload BeamShare-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry BeamShare-unsigned.ipa Payload
    artifacts:
      - BeamShare-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android APK
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  # ---------------------------------------------------------------------
  # PAID ONLY. Needs: Apple Developer Program, an App Store Connect API key
  # added in Codemagic as integration "BeamShareASC", the app created in
  # App Store Connect (put its numeric Apple ID below), and the Hotspot
  # capability + CODE_SIGN_ENTITLEMENTS (see ios/Runner/Runner.entitlements).
  # ---------------------------------------------------------------------
  ios-testflight-paid:
    name: iOS -> TestFlight (paid Apple account)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BeamShareASC
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beamshare.beamShare
      vars:
        APP_STORE_APPLE_ID: 0000000000
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --dart-define=IOS_HOTSPOT=true \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
